<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Pertemuan 3 JavaScript</title>
</head>
<body>

    <h2>Manajemen Produk Toko</h2>

    <div id="hasil"></div>

    <script>
        let produkToko = [
            {
                id: 1,
                nama: "Laptop",
                harga: 7000000,
                stok: 5
            },
            {
                id: 2,
                nama: "Mouse",
                harga: 200000,
                stok: 10
            },
            {
                id: 3,
                nama: "Keyboard",
                harga: 350000,
                stok: 7
            }
        ];

        function tambahProduk(nama, harga, stok) {
            let idBaru = produkToko.length + 1;

            let produkBaru = {
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            };

            produkToko.push(produkBaru);
        }

        function hapusProduk(id) {
            produkToko = produkToko.filter(function(produk) {
                return produk.id !== id;
            });
        }

        function tampilkanProduk() {
            let hasil = "<h3>Daftar Produk</h3>";

            hasil += "<table border='1' cellpadding='10'>";
            hasil += "<tr>";
            hasil += "<th>ID</th>";
            hasil += "<th>Nama Produk</th>";
            hasil += "<th>Harga</th>";
            hasil += "<th>Stok</th>";
            hasil += "</tr>";

            produkToko.forEach(function(produk) {
                hasil += "<tr>";
                hasil += "<td>" + produk.id + "</td>";
                hasil += "<td>" + produk.nama + "</td>";
                hasil += "<td>Rp " + produk.harga.toLocaleString("id-ID") + "</td>";
                hasil += "<td>" + produk.stok + "</td>";
                hasil += "</tr>";
            });

            hasil += "</table>";

            document.getElementById("hasil").innerHTML = hasil;
        }

        tambahProduk("Headset", 500000, 8);

        tampilkanProduk();
    </script>

</body>
</html>
